<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/cooperativismo.png" />
    <link rel="apple-touch-icon" href="/cooperativismo.png" />
    <title>SICOOP PLATFORM - Sistema Integrado de Gestão de Cooperativas</title>
    <meta name="description" content="Plataforma ERP modular e integrada para gestão completa de cooperativas, SisGepa (PAA/PNAE), SisCont, SisFin, Compras, Estoque, RH, BI e Portais." />
    <meta property="og:title" content="SICOOP PLATFORM - Sistema Integrado de Gestão de Cooperativas" />
    <meta property="og:description" content="Plataforma ERP modular e integrada para gestão completa de cooperativas, SisGepa (PAA/PNAE), SisCont, SisFin, Compras, Estoque, RH, BI e Portais." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00733c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Siscoop" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <main style="max-width:32rem;margin:4rem auto;padding:0 1rem;text-align:center;font:1rem system-ui,sans-serif">
        <p role="status">Carregando SISCOOP…</p>
        <div id="recuperar-inicializacao" hidden>
          <p>Se o aplicativo demorar a abrir, verifique a conexão e recarregue a página.</p>
          <button type="button" onclick="window.location.reload()">Recarregar página</button>
        </div>
      </main>
    </div>
    <script>
      window.setTimeout(() => {
        const recuperar = document.getElementById('recuperar-inicializacao');
        if (recuperar) recuperar.hidden = false;
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
